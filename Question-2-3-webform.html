<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form validation with messages on top: Code example - Accessibility Developer Guide example</title>
        <meta charset="utf-8">
        <style>.control, fieldset {
      margin: 6px 0;
    }
    
    label {
      display: inline-block;
      width: 120px;
      vertical-align: top;
    }
    
    input + label {
      width: auto;
    }
    
    .error, .required {
      color: red;
    }
    
    fieldset ul {
      margin: 0;
    }</style>
    </head>
    <body>
        <h1>Feedback form</h1>
    <!-- I added instructions to let the user know which fields are required, and I added (required) to each label -->       
        <p>Please fill in all fields labeled (required) before submitting the form. </p>   
        <form>
        <div class="control">
          <!-- I added a label for name to connect it to the input field, because when I tested the page with NVDA it wasn't saying to the user what to write in the input field-->
          <!-- I added aria-required to let screen readers know that the fields are required -->
          <label for="name">Full name <span class="required">(required)</span></label>
          <input id="name" name="name" type="text" aria-required="true" />
        </div>
        <div class="control">
          <!-- I added for attribute to the label to connect it to the textarea and I also added aria-describedby to connect the instructions to the Biography field-->
          <!-- I added aria-required to let screen readers know that the fields are required -->
          <label for="biography">Biography <span class="required">(required)</span></label>
          <textarea id="biography" name="biography"  aria-describedby="biographyInfo" aria-required="true"></textarea>
          <span id="biographyInfo">Include examples on your skills in JavaScript.</span>
        </div>
        <!-- I added a fieldset and legend to group the gender radio buttons-->
        <fieldset>
          <legend>Gender <span class="required">(required)</span></legend>
          <div class="control">
            <!-- I added for attribute to the label for the Male gender to connect it to the Male input-->
            <!-- I added aria-required to let screen readers know that the fields are required -->
            <input id="gender_male" name="gender" type="radio" value="male" aria-required="true" />
            <label for="gender_male">Male</label>
          </div>
          <div class="control">
            <!-- I added for attribute to the label for the Female gender to connect it to the Female input-->
            <!-- I added aria-required to let screen readers know that the fields are required -->
            <input id="gender_female" name="gender" type="radio" value="female" aria-required="true" />
            <label for="gender_female">Female</label>
          </div>
        </fieldset>
        <div class="control">
          <!--I added the for attribute to connect the label to the checkbox-->
          <!-- I added aria-required to let screen readers know that the fields are required -->
          <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" aria-required="true" />
          <label for="accept_agbs">I accept the terms and conditions <span class="required">(required)</span></label>
        </div>
        <div class="control">
          <input name="validate" type="hidden" value="1" /><input type="submit" value="Register" />
        </div>
      </form>
      
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
          <script>"use strict";
      
      ;
      (function () {
        var validateInput;
      
        $.urlParam = function (name) {
          var results;
          results = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
      
          if (results === null) {
            return null;
          } else {
            return decodeURI(results[1]) || null;
          }
        };
      
        validateInput = function validateInput(input, message) {
          var $elementToDescribe, $error, $errorContainer, $fieldset, $input, $referencedElement, value;
          $input = $('[name="' + input + '"]');
      
          if ((value = $.urlParam(input)) === null) {
            if ($('fieldset.errors').length === 0) {
              // I added tabindex="-1" so JavaScript can move focus to the Errors section
              $('form').prepend('<fieldset class="errors" tabindex="-1"><legend>Errors</legend><ul></ul></fieldset>');
            }
      
            $referencedElement = null;
            $elementToDescribe = null;
            $errorContainer = $('fieldset.errors ul');
      
            if ($input.is(':radio')) {
              $fieldset = $input.closest('fieldset');
              $elementToDescribe = $fieldset;
              $referencedElement = $input.filter(':first');
            } else {
              $elementToDescribe = $input;
              $referencedElement = $input;
            }
      // R.G. hint: fix next line ;)
            // I added an id to each error message so aria-describedby can connect it to the corresponding field
            $error = $('<a href="#" id="' + input + '_description">' + message + '</a>');
            $error.click(function (e) {
              // If we rely on the link's href pointing to the input's ID, it doesn't trigger forms mode in screen readers
              $referencedElement.focus();
              return e.preventDefault();
            });
            $elementToDescribe.attr('aria-describedby', input + '_description');
            $errorContainer.append('<li>').find('li:last').append($error);
      
            if ($(':not(form):focus').length === 0) {
              // See https://stackoverflow.com/questions/46134247/jquery-setting-focus-doesnt-work-in-ie11/
              // I added focus so the user is taken to the Errors section when the form is submitted with errors
              $('fieldset.errors').focus();
            }
          } else {
            if ($input.is(':checkbox')) {
              $input.attr('checked', true);
            }
      
            if ($input.is(':radio')) {
              return $input.filter('[value="' + value + '"]').attr('checked', true);
            } else {
              return $input.val(value);
            }
          }
        };
      
        $(document).ready(function () {
          if ($.urlParam('validate')) {
            validateInput('name', 'Please enter your name!');
            validateInput('biography', 'Please tell us something about your history!');
            validateInput('gender', 'Please tell us your gender!');
            validateInput('accept_agbs', 'You must accept our terms and conditions!');
      
            // I changed .error to .errors to check if the form has any validation errors
            if ($('.errors').length === 0) {
              return alert('All inputs are valid.');
            }
          }
        });
      }).call(void 0);</script>
                
        </body>
      </html>
